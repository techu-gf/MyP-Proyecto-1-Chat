version: '3'

tasks:
  servidor:
    desc: Ejecuta el servidor
    cmds:
      - go run src/main/Modelo/EjecutaServidor.go {{.CLI_ARGS}} || true
    silent: true

  clean:
    desc: Elimina archivos de respaldo temporales de Emacs
    cmds:
      - find . -type f \( -name "*~" -o -name "#*#" \) -delete
    silent: true

  cliente:
      desc: Ejecuta el cliente
      cmds:
        - dotnet run --project src/main/ -- {{.CLI_ARGS}}
    
